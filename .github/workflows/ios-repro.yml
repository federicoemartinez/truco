name: iOS repro

# Debug only: runs repro.html in Safari on an iPhone 15 Pro simulator (the newest iOS 26 the runner has)
# and keeps a screenshot of every step
on:
  push:
    branches: [debug/ios-cards]
  workflow_dispatch:

jobs:
  repro:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Boot an iPhone 15 Pro
        run: |
          xcrun simctl list runtimes
          RUNTIME=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.platform == "iOS" and .isAvailable)] | last | .identifier')
          UDID=$(xcrun simctl create repro "iPhone 15 Pro" "$RUNTIME" || xcrun simctl create repro "iPhone 16 Pro" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          xcrun simctl status_bar booted override --time 9:41
      - name: Run repro.html in Safari
        run: |
          mkdir -p shots
          npx vite --config repro.vite.config.mjs --port 5199 --strictPort > shots/vite.log 2>&1 &
          until curl -sf http://localhost:5199/repro.html > /dev/null; do sleep 1; done
          # Safari's first launch can outlast openurl's timeout: start it first, then retry
          xcrun simctl launch booted com.apple.mobilesafari
          sleep 10
          for i in 1 2 3; do xcrun simctl openurl booted http://localhost:5199/repro.html && break; sleep 10; done
          for i in $(seq 300); do [ -f shots/done ] && break; sleep 2; done
          ls shots
          [ -f shots/done ]
      - name: Screenshot of whatever is on screen
        if: failure()
        run: xcrun simctl io booted screenshot shots/on-failure.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots
